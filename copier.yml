_min_copier_version: '9'
_templates_suffix: .jinja
_subdirectory: template
_overwrite: true
_update: true
_envops:
  autoescape: false
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

_repo: "https://github.com/mohammedsameeruddin-blk/mlops_template"

_message_before_copy: |
  Thanks for using our MLOps template to bootstrap your new project.

  IMPORTANT - Naming convention:
    Your project directory must be named  mlops_<project_name>
    Run this command from your workspace:

      copier copy <template_url> mlops_<project_name>

    Example:
      copier copy git@github.com:mohammedsameeruddin-blk/mlops_template.git mlops_store_sales

  Please reply to the questions carefully as the answers will be used to configure the scaffold of your project.

# MLOps project info
project:
  type: str
  help: "Your MLOps project name (without prefixes like mlops_, mlops-, etc)"
  validator: >-
    {% if not project or project | regex_search('[^a-zA-Z0-9_-]') %}
    project must contain letters, numbers, dashes and underscores.
    {% endif %}

# Ask every time to create a new model onboarding pipeline
model:
  type: str
  help: "Your model name (e.g., customer)"
  validator: >-
    {% if not model or model | regex_search('[^a-zA-Z0-9_-]') %}
    model must contain letters, numbers, dashes and underscores.
    {% endif %}

# Ask every time to create a new dataset keyword for preprocessing and featurization
dataset_keyword:
  type: str
  help: "Your dataset keyword (e.g., customer_transactions)"
  validator: >-
    {% if not dataset_keyword or dataset_keyword | regex_search('[^a-zA-Z0-9_-]') %}
    dataset_keyword must contain letters, numbers, dashes and underscores.
    {% endif %}

author_email:
  type: str
  help: "Your email address"
  validator: >-
    {% if not (author_email | regex_search('([A-Za-z0-9]+[.-_])*[A-Za-z0-9]+@[A-Za-z0-9-]+(\.[A-Z|a-z]{2,})+'))
    %}
    author_email is not a valid email address.
    {% endif %}

dev_host:
  type: str
  help: "Databricks `DEV` host"
  validator: >-
    {% if not dev_host %}
    dev_host is required.
    {% endif %}

qa_host:
  type: str
  help: "Databricks `QA` host"
  default: "{{ dev_host }}"

prod_host:
  type: str
  help: "Databricks `PROD` host"
  default: "{{ dev_host }}"

# DS project info
ds_project:
  type: str
  help: "Your DS project name (without prefixes like ds_, ds-, etc)"
  description: >-
    This will be used as a package dependency in pyproject.toml and should
    match the name of the package you have published or will publish to your
    artifact repository.
  validator: >-
    {% if not ds_project or ds_project | regex_search('[^a-zA-Z0-9_-]') %}
    ds_project must contain letters, numbers, dashes and underscores.
    {% endif %}

_skip_if_exists:
  - databricks.yml
  - MANIFEST.in
  - pyproject.toml

_tasks:
  - command:
      - "{{ _copier_python }}"
      - "-c"
      - |
        import pathlib, sys
        cwd = pathlib.Path.cwd()
        # During copier update, tasks run in a temp dir (copier._main.*) — skip validation there
        if cwd.name.startswith('copier.') or not pathlib.Path('.copier-answers.yml').is_file():
            sys.exit(0)
        if not cwd.name.startswith('mlops_'):
            print('\n' + '=' * 60)
            print('ERROR: Project directory must be named with a "mlops_" prefix.')
            print(f'  Current : {cwd.name}')
            print(f'  Expected: mlops_{{ project }}')
            print()
            print('Delete this directory and re-run from your workspace:')
            print()
            print(f'  copier copy git@github.com:mohammedsameeruddin-blk/mlops_template.git mlops_{{ project }} --trust')
            print('=' * 60 + '\n')
            sys.exit(1)

_message_after_copy: |
  Your project mlops_{{ project }} is ready!

  Next steps:
    1. Install dependencies:
         uv sync

    2. Initialize git (if this is a new project):
         git init
         git checkout -b main
         git add .
         git commit -m "chore: initial project scaffold from template"

    3. To update this project when a new template version is released:
         copier update --vcs-ref <version> --trust

    4. If updating an existing project, review the changes and commit them:
         git diff
         git add .
         git commit -m "chore: update project scaffold from template"