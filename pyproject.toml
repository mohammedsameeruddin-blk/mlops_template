[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-cli"
version = "0.1.2"
description = "CLI tool for managing mlops projects"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "MLOps Team" }
]

dependencies = [
    "click>=8.0.0",
    "colorama>=0.4.4",
    "jinja2>=3.1.0",
    "python_benedict==0.34.1",
    "ruamel.yaml==0.19.1",
]

[project.scripts]
mlops-cli = "mlops_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlops_cli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mlops_cli = ["templates/**/*.jinja", "templates/**/*.yml"]
